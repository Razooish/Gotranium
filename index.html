<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gotra Matcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/gotra.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body class="bg-gray-100 text-gray-900">
    <!-- Header Section -->
    <header class="bg-[#141414] text-gray-200 shadow fixed w-full z-50">
      <div
        class="container mx-auto flex justify-between items-center px-4 py-3"
      >
        <!-- Logo -->
        <div class="text-lg md:text-2xl lg:text-3xl font-bold">
          <a href="#" class="hover:text-[#ffc72b] transition duration-300"
            >GotraPidit</a
          >
        </div>

        <!-- Middle Navigation Links (Hidden on mobile) -->
        <nav class="hidden md:flex space-x-8">
          <a
            href="#ours"
            class="text-gray-200 font-medium py-2 px-4 rounded-lg transition duration-300 hover:bg-[#fcda79] hover:text-black"
            >Gotra Ours</a
          >
          <a
            href="#mine"
            class="text-gray-200 font-medium py-2 px-4 rounded-lg transition duration-300 hover:bg-[#fcda79] hover:text-black"
            >Gotra Mine</a
          >
          <a
            href="#learn"
            class="text-gray-200 font-medium py-2 px-4 rounded-lg transition duration-300 hover:bg-[#fcda79] hover:text-black"
            >Learn</a
          >
          <a
            href="#about"
            class="text-gray-200 font-medium py-2 px-4 rounded-lg transition duration-300 hover:bg-[#fcda79] hover:text-black"
            >About</a
          >
        </nav>

        <!-- Mobile Menu Button -->
        <button id="menu-toggle" class="md:hidden focus:outline-none">
          <svg
            class="w-7 h-7 text-gray-200"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16m-7 6h7"
            />
          </svg>
        </button>
      </div>

      <!-- Sliding Aside Menu -->
      <aside
        id="mobile-menu"
        class="fixed top-0 right-0 text-gray-200 bg-[#141414] shadow-lg w-1/2 h-full transform translate-x-full transition-transform duration-300 ease-in-out md:hidden"
      >
        <div class="p-4">
          <button id="menu-close" class="focus:outline-none mb-4">
            <svg
              class="w-6 h-6 text-gray-200"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
          <nav class="flex flex-col space-y-6 text-lg">
            <a
              href="#ours"
              class="text-gray-200 font-medium py-3 px-4 rounded-lg transition duration-300 hover:bg-[#fcda79] hover:text-black"
              >Gotra Ours</a
            >
            <a
              href="#mine"
              class="text-gray-200 font-medium py-3 px-4 rounded-lg transition duration-300 hover:bg-[#fcda79] hover:text-black"
              >Gotra Mine</a
            >
            <a
              href="#learn"
              class="text-gray-200 font-medium py-3 px-4 rounded-lg transition duration-300 hover:bg-[#fcda79] hover:text-black"
              >Learn</a
            >
            <a
              href="#about"
              class="text-gray-200 font-medium py-3 px-4 rounded-lg transition duration-300 hover:bg-[#fcda79] hover:text-black"
              >About</a
            >
          </nav>
        </div>
      </aside>
    </header>

    <!-- Placeholder Sections -->
    <div
      id="ours"
      class="min-h-screen bg-[#fcda79] px-4 sm:px-6 lg:px-10 py-20 sm:py-20"
    >
      <!-- Text Section -->
      <div class="max-w-3xl mx-auto text-center">
        <h2
          class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-black mb-6 sm:mb-8"
        >
          Gotra Milxa ?
        </h2>
        <p class="text-base sm:text-lg lg:text-xl text-black mb-8 sm:mb-12">
          Enter your caste details to find out if you're compatible for marriage
          based on Gotra.
        </p>
      </div>

      <!-- Input Form Section -->
      <div
        class="max-w-2xl mx-auto bg-[#141414] text-gray-200 shadow-lg rounded-lg p-6 sm:p-8"
      >
        <!-- Your Caste Input -->
        <label class="block mb-6 relative">
          <span class="block text-sm sm:text-lg font-semibold text-gray-200"
            >Your Caste</span
          >
          <input
            type="text"
            id="my-cast"
            class="mt-2 p-2 sm:p-3 border-b border-gray-300 rounded-lg w-full bg-[#262626] text-gray-200 focus:ring focus:ring-blue-200 focus:outline-none"
            placeholder="Enter your caste"
            autocomplete="off"
          />
          <ul
            id="my-cast-suggestions"
            class="absolute z-10 bg-[#3d3d3d] border border-gray-200 rounded-lg shadow-lg w-full hidden max-h-40 overflow-y-auto"
          ></ul>
        </label>

        <!-- Her Caste Input -->
        <label class="block mb-6 relative">
          <span class="block text-sm sm:text-lg font-semibold text-gray-200"
            >Her Caste</span
          >
          <input
            type="text"
            id="her-cast"
            class="mt-2 p-2 sm:p-3 border-b border-gray-300 rounded-lg w-full bg-[#262626] text-gray-200 focus:ring focus:ring-blue-200 focus:outline-none"
            placeholder="Enter her caste"
            autocomplete="off"
          />
          <ul
            id="her-cast-suggestions"
            class="absolute z-10 bg-[#3d3d3d] border border-gray-200 rounded-lg shadow-lg w-full hidden max-h-40 overflow-y-auto"
          ></ul>
        </label>

        <!-- Submit Button -->
        <button
          id="check-gotra"
          class="w-full sm:w-1/2 bg-[#ffc72b] text-black text-base sm:text-lg py-3 rounded-lg hover:bg-yellow-500 transition duration-300 mx-auto block"
        >
          Check
        </button>

        <!-- Result Section -->
        <div
          id="result"
          class="text-center mt-6 text-lg sm:text-xl font-semibold text-gray-700"
        ></div>
      </div>
    </div>

    <div id="mine" class="h-screen bg-gray-200 p-6 pt-20">
      Gotra Mine Section
    </div>
    <div id="learn" class="h-screen bg-gray-300 p-6 pt-20">Learn Section</div>
    <div id="about" class="h-screen bg-gray-400 p-6 pt-20">About Section</div>
  </body>
</html>
